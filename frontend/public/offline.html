<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wealth VN — Không có kết nối</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #e2e8f0;
        padding: 1.5rem;
      }
      .card {
        max-width: 28rem;
        width: 100%;
        text-align: center;
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 1rem;
        padding: 2.5rem 2rem;
        backdrop-filter: blur(12px);
      }
      .logo {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.5rem;
        border-radius: 1rem;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
      }
      .logo svg {
        width: 2rem;
        height: 2rem;
        fill: #ffffff;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      p {
        font-size: 0.9375rem;
        line-height: 1.6;
        color: #94a3b8;
        margin-bottom: 1.75rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.625rem 1.5rem;
        border: none;
        border-radius: 0.625rem;
        font-size: 0.9375rem;
        font-weight: 600;
        color: #ffffff;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        cursor: pointer;
        transition: opacity 0.2s ease;
      }
      .btn:hover {
        opacity: 0.9;
      }
      .btn:active {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93V18h-2v1.93C7.95 19.5 5.5 17.05 5.07 14H7v-2H5.07C5.5 8.95 7.95 6.5 11 6.07V8h2V6.07c3.05.43 5.5 2.88 5.93 5.93H17v2h1.93c-.43 3.05-2.88 5.5-5.93 5.93z"
          />
        </svg>
      </div>
      <h1>Wealth VN — Không có kết nối</h1>
      <p>
        Vui lòng kiểm tra kết nối mạng và thử lại. Dữ liệu đã lưu vẫn có thể xem
        trong ứng dụng.
      </p>
      <button class="btn" onclick="window.location.reload()">Thử lại</button>
    </div>
  </body>
</html>
