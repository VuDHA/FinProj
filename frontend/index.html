<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#3B82F6" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      try {
        var key = localStorage.getItem("wealth-theme");
        var valid = ["clean-slate", "command-center", "eco-logistics", "high-contrast", "espresso-cream", "sky-blue", "midnight-navy", "royal-plum", "solarized-sand", "mint-slate", "graphite-rose"];
        var theme = valid.indexOf(key) >= 0 ? key : "clean-slate";
        document.documentElement.classList.add("theme-" + theme);
      } catch (e) {
        document.documentElement.classList.add("theme-clean-slate");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap"
    rel="stylesheet" />
  <title>Wealth VN - Quản lý tài sản</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
