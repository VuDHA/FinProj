name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # --- Frontend ---
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # --- Backend sidecar ---
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build sidecar with PyInstaller
        working-directory: backend
        run: pyinstaller pyinstaller.spec --noconfirm

      - name: Rename sidecar to target-triple suffix
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Move-Item -Force backend/dist/wealth-backend.exe `
            src-tauri/binaries/wealth-backend-x86_64-pc-windows-msvc.exe

      # --- Tauri build + release ---
      - name: Build & release with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Wealth VN v__VERSION__'
          releaseBody: |
            Xem các tệp đính kèm bên dưới để tải xuống.

            **Wealth VN** — Ứng dụng quản lý tài sản cá nhân.

            ## Hướng dẫn cài đặt
            1. Tải tệp `.exe` (NSIS) hoặc `.msi` phù hợp với hệ thống của bạn.
            2. Chạy tệp cài đặt và làm theo hướng dẫn.
            3. Khởi động ứng dụng — dữ liệu cũ (nếu có) sẽ được giữ nguyên.

            **Changelog:**
            - Xem chi tiết thay đổi trong commit history.
          releaseDraft: true
          prerelease: false
          args: '--target x86_64-pc-windows-msvc'

      # --- Verification ---
      - name: Print SHA256 of installer artifacts
        shell: pwsh
        run: |
          Write-Host "=== SHA256 checksums of installer artifacts ==="
          $bundleDir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          if (Test-Path $bundleDir) {
            Get-ChildItem -Recurse $bundleDir -Include *.exe,*.msi | ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash
              Write-Host "$hash  $($_.Name)"
            }
          } else {
            Write-Host "Bundle directory not found: $bundleDir"
          }
